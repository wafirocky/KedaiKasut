# Runs the production image exactly the way EasyPanel will run it.
#   docker compose -f compose.prod.yaml up -d --build
# Reads APP_KEY (and friends) from .env.docker — see .env.docker.example.
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'kedaikasut:latest'
        restart: unless-stopped
        env_file:
            - .env.docker
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - 'kedaikasut-data:/data'
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@file_get_contents("http://127.0.0.1:8000/up") ? 0 : 1);']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
volumes:
    kedaikasut-data:
        driver: local
